[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-sorting"
version = "2.0.0"
description = "Watch the patterns sorting algorithms leave behind."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Luan Utimura" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7", "Pillow>=10"]

[project.scripts]
visual-sorting = "visual_sorting.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
